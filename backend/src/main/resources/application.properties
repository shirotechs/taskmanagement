spring.application.name=taskmanagement

# --- H2 in-memory DB (for quick startup without external DB) ---
# spring.datasource.url=jdbc:h2:mem:taskdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- MySQL (Docker) ---
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanagement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernateがテーブルを作成した後にdata.sqlを実行する
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080
