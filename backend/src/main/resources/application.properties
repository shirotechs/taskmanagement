spring.application.name=taskmanagement

# --- MySQL (Docker) ---
# 接続情報は環境変数で上書きできる(未指定時はローカル開発用のデフォルト)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanagement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update

# サンプルデータの投入は dev プロファイル限定(既定では起動してもデータを消さない)
spring.sql.init.mode=never

server.port=8080
